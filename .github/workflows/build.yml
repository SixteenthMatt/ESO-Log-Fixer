name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install nuitka zstandard

      - name: Build Executable with Nuitka
        run: |
          nuitka --standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --windows-icon-from-ico=eso_log_fixer2.ico `
            --windows-company-name="@SixteenthMatt" `
            --windows-product-name="ESO Log Fixer" `
            --windows-file-description="ESO Encounter Log Fixer Utility" `
            --windows-file-version=1.0.0.0 `
            --windows-product-version=1.0.0.0 `
            --copyright="Provided AS-IS. Use at your own risk." `
            --output-dir=build_out `
            eso_log_fixer.py

      - name: Archive Build Folder
        run: |
          Compress-Archive -Path "build_out\eso_log_fixer.dist\*" -DestinationPath "ESOLogFixer-v1.0.0.zip"

      - name: Create Release and Upload ZIP
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ESOLogFixer-v1.0.0.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
